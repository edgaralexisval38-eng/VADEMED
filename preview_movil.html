<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VadeMed — Vista en celular</title>
<style>
  body{margin:0;min-height:100vh;background:radial-gradient(130% 90% at 50% -10%,#f2ede4,#e6e0d6 60%,#e1dacf);display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  h1{font-size:16px;font-weight:800;color:#0e1c3f;margin:0;}
  h1 .m{color:#5aa4c2;}
  .hint{font-size:12.5px;color:#66708a;margin:0 0 6px;}
  .phone{width:392px;max-width:100%;height:812px;background:#0e1c3f;border-radius:46px;padding:13px;box-shadow:0 44px 90px -34px rgba(14,28,63,.55);position:relative;}
  .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0e1c3f;border-radius:0 0 16px 16px;z-index:2;}
  .phone iframe{width:100%;height:100%;border:none;border-radius:33px;background:#fff;}
</style>
</head>
<body>
  <h1>Vade<span class="m">Med</span> · vista en celular 📱</h1>
  <p class="hint">Así se vería tu página de venta en un teléfono. Puedes hacer scroll dentro del marco.</p>
  <div class="phone">
    <div class="notch"></div>
    <iframe src="venta.html" title="Vista móvil de la landing"></iframe>
  </div>
</body>
</html>
